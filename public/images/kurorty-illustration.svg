<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Иллюстрация лечебного курорта: санаторий у термального источника">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f7f1"/>
      <stop offset="1" stop-color="#f6fcfa"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe0d0"/>
      <stop offset="1" stop-color="#2f9e8e"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.6" stop-color="#ffe9b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="650" cy="140" r="150" fill="url(#sun)"/>
  <circle cx="650" cy="140" r="46" fill="#ffe1a0"/>

  <!-- Distant mountains (spa valley) -->
  <path d="M0 300 L150 190 L280 300 Z" fill="#bfe6db"/>
  <path d="M180 300 L360 165 L540 300 Z" fill="#a7dccd"/>
  <path d="M430 300 L620 200 L800 300 L800 300 Z" fill="#c7ebe1"/>

  <!-- Hill band -->
  <rect x="0" y="298" width="800" height="70" fill="#e4f5ef"/>
  <path d="M0 320 Q200 300 400 318 T800 316 L800 368 L0 368 Z" fill="#d3efe6"/>

  <!-- Trees -->
  <g fill="#66c4ac">
    <circle cx="95" cy="300" r="26"/><rect x="91" y="300" width="8" height="26" fill="#4aa892"/>
    <circle cx="140" cy="308" r="20"/><rect x="137" y="308" width="6" height="22" fill="#4aa892"/>
    <circle cx="705" cy="304" r="24"/><rect x="701" y="304" width="8" height="26" fill="#4aa892"/>
    <circle cx="745" cy="312" r="18"/><rect x="742" y="312" width="6" height="20" fill="#4aa892"/>
  </g>

  <!-- Sanatorium / Kurhaus building -->
  <g>
    <!-- side wings -->
    <rect x="250" y="200" width="90" height="150" rx="4" fill="url(#building)" stroke="#d5e8e2" stroke-width="2"/>
    <rect x="460" y="200" width="90" height="150" rx="4" fill="url(#building)" stroke="#d5e8e2" stroke-width="2"/>
    <rect x="250" y="192" width="90" height="14" rx="3" fill="#2f9e8e"/>
    <rect x="460" y="192" width="90" height="14" rx="3" fill="#2f9e8e"/>

    <!-- central block -->
    <rect x="330" y="150" width="140" height="200" rx="4" fill="url(#building)" stroke="#d5e8e2" stroke-width="2"/>
    <!-- pediment / dome -->
    <path d="M330 150 L400 104 L470 150 Z" fill="#eef6f3" stroke="#d5e8e2" stroke-width="2"/>
    <circle cx="400" cy="96" r="10" fill="#2f9e8e"/>
    <rect x="397" y="70" width="6" height="22" fill="#2f9e8e"/>

    <!-- colonnade -->
    <g fill="#f4faf8" stroke="#d5e8e2" stroke-width="1.5">
      <rect x="344" y="250" width="12" height="100"/>
      <rect x="368" y="250" width="12" height="100"/>
      <rect x="392" y="250" width="12" height="100"/>
      <rect x="416" y="250" width="12" height="100"/>
      <rect x="440" y="250" width="12" height="100"/>
    </g>
    <rect x="336" y="244" width="128" height="10" fill="#e0efe9"/>

    <!-- arched windows on central block -->
    <g fill="#bfe6db">
      <path d="M350 176 h20 v22 a10 10 0 0 0 -20 0 Z"/>
      <path d="M390 176 h20 v22 a10 10 0 0 0 -20 0 Z"/>
      <path d="M430 176 h20 v22 a10 10 0 0 0 -20 0 Z"/>
    </g>
    <!-- windows on wings -->
    <g fill="#bfe6db">
      <rect x="266" y="224" width="20" height="26" rx="3"/>
      <rect x="304" y="224" width="20" height="26" rx="3"/>
      <rect x="266" y="270" width="20" height="26" rx="3"/>
      <rect x="304" y="270" width="20" height="26" rx="3"/>
      <rect x="476" y="224" width="20" height="26" rx="3"/>
      <rect x="514" y="224" width="20" height="26" rx="3"/>
      <rect x="476" y="270" width="20" height="26" rx="3"/>
      <rect x="514" y="270" width="20" height="26" rx="3"/>
    </g>

    <!-- wellness emblem (leaf + drop) on the pediment -->
    <g transform="translate(400 128)">
      <path d="M0 -8 C 8 -2 8 8 0 12 C -8 8 -8 -2 0 -8 Z" fill="#2f9e8e"/>
    </g>
  </g>

  <!-- Thermal pool -->
  <path d="M0 400 Q400 360 800 400 L800 600 L0 600 Z" fill="url(#water)"/>
  <!-- wave lines -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M120 452 q30 -14 60 0 t60 0"/>
    <path d="M470 470 q30 -14 60 0 t60 0"/>
    <path d="M250 510 q34 -16 68 0 t68 0"/>
    <path d="M540 520 q30 -14 60 0 t60 0"/>
  </g>

  <!-- Rising steam (thermal spring) -->
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M360 398 q-16 -26 0 -52 q14 -22 0 -46"/>
    <path d="M410 398 q16 -24 0 -48 q-14 -22 0 -44"/>
    <path d="M448 402 q-12 -20 0 -40"/>
  </g>

  <!-- Foreground reeds / plants -->
  <g stroke="#3fae99" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M60 600 C 58 540 66 520 60 470"/>
    <path d="M84 600 C 86 548 94 528 92 486"/>
    <path d="M740 600 C 742 545 734 522 742 476"/>
  </g>
  <g fill="#57bda7">
    <path d="M60 470 q-22 -6 -30 -26 q24 -2 30 26 Z"/>
    <path d="M92 486 q22 -6 30 -24 q-24 -4 -30 24 Z"/>
    <path d="M742 476 q22 -6 30 -24 q-24 -4 -30 24 Z"/>
  </g>
</svg>
